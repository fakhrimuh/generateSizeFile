<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Size Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="head">
        <h1>File Size Generator</h1>
        <p class="subtitle">Buat file dengan ukuran yang tepat.</p>
      </header>

      <form id="fileForm" class="form">
        <div class="field">
          <label for="fileSize">Ukuran file</label>
          <div class="input-group">
            <input
              type="number"
              id="fileSize"
              step="0.01"
              min="0.01"
              placeholder="100"
              required
            />
            <select id="unit" aria-label="Satuan ukuran">
              <option value="kb">KB</option>
              <option value="mb">MB</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Tipe file</label>
          <div class="type-grid" role="radiogroup" aria-label="Tipe file">
            <label class="type-option">
              <input type="radio" name="fileType" value="txt" checked />
              <span>TXT</span>
            </label>
            <label class="type-option">
              <input type="radio" name="fileType" value="csv" />
              <span>CSV</span>
            </label>
            <label class="type-option">
              <input type="radio" name="fileType" value="json" />
              <span>JSON</span>
            </label>
            <label class="type-option">
              <input type="radio" name="fileType" value="pdf" />
              <span>PDF</span>
            </label>
            <label class="type-option">
              <input type="radio" name="fileType" value="png" />
              <span>PNG</span>
            </label>
            <label class="type-option">
              <input type="radio" name="fileType" value="jpg" />
              <span>JPG</span>
            </label>
            <label class="type-option">
              <input type="radio" name="fileType" value="gif" />
              <span>GIF</span>
            </label>
            <label class="type-option">
              <input type="radio" name="fileType" value="zip" />
              <span>ZIP</span>
            </label>
            <label class="type-option">
              <input type="radio" name="fileType" value="docx" />
              <span>DOCX</span>
            </label>
            <label class="type-option">
              <input type="radio" name="fileType" value="xlsx" />
              <span>XLSX</span>
            </label>
          </div>
        </div>

        <label class="check">
          <input type="checkbox" id="boundaryMode" />
          <span>
            <strong>Mode batas</strong>
            <small
              >Buat 3 file: ukuran −1 byte, tepat, dan +1 byte — untuk menguji
              validasi batas upload.</small
            >
          </span>
        </label>

        <button type="submit" class="btn" id="generateBtn">
          Generate file
        </button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="generators.js"></script>
    <script src="script.js"></script>
  </body>
</html>
